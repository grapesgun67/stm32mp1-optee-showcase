<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="425" viewBox="0 0 1040 425" role="img" aria-labelledby="title desc"><title id="title">세션 상태와 영속 키의 수명</title><desc id="desc">미준비에서 대기로 전이하고 처리 시도는 요청을 소비한다. 세션 데이터는 사라지지만 영속 키는 유지된다.</desc><rect width="100%" height="100%" fill="#f6f4ef"/><text x="24" y="36" font-family="system-ui,Malgun Gothic,sans-serif" font-size="22" fill="#102e32" font-weight="700">RAM: 세션과 함께 사라지는 승인 상태</text><rect x="25" y="67" width="292" height="109" rx="12" fill="#ffffff" stroke="#ccd9d2"/><text x="43" y="98" font-family="system-ui,Malgun Gothic,sans-serif" font-size="21" fill="#102e32" font-weight="700">IDLE</text><text x="43" y="127" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#536a6d" font-weight="400">대기 요청 없음</text><rect x="372" y="67" width="292" height="109" rx="12" fill="#ffffff" stroke="#ccd9d2"/><text x="390" y="98" font-family="system-ui,Malgun Gothic,sans-serif" font-size="21" fill="#102e32" font-weight="700">PENDING</text><text x="390" y="127" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#536a6d" font-weight="400">해시 + 챌린지 + 키 핸들</text><rect x="719" y="67" width="292" height="109" rx="12" fill="#ffffff" stroke="#ccd9d2"/><text x="737" y="98" font-family="system-ui,Malgun Gothic,sans-serif" font-size="21" fill="#102e32" font-weight="700">IDLE</text><text x="737" y="127" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#536a6d" font-weight="400">처리 시도 후 요청 소비</text><line x1="321" y1="111" x2="366" y2="111" stroke="#176650" stroke-width="2"/><polygon points="366,111 356.9955289764732,115.3496553411123 356.9955289764732,106.6503446588877" fill="#176650"/><text x="322" y="91" font-family="system-ui,Malgun Gothic,sans-serif" font-size="15" fill="#102e32" font-weight="400">준비</text><line x1="669" y1="111" x2="714" y2="111" stroke="#176650" stroke-width="2"/><polygon points="714,111 704.9955289764732,115.3496553411123 704.9955289764732,106.6503446588877" fill="#176650"/><text x="665" y="91" font-family="system-ui,Malgun Gothic,sans-serif" font-size="15" fill="#102e32" font-weight="400">처리</text><text x="30" y="202" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#536a6d" font-weight="400">유효한 형식으로 처리 진입: 검증 실패도 요청 소비.</text><text x="30" y="225" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#536a6d" font-weight="400">타입/길이/SHORT_BUFFER 사전 오류: 대기 요청 유지.</text><rect x="25" y="238" width="990" height="163" rx="12" fill="#e7f2ec" stroke="#ccd9d2"/><text x="45" y="270" font-family="system-ui,Malgun Gothic,sans-serif" font-size="21" fill="#176650" font-weight="700">영속 객체: 세션을 닫거나 재부팅해도 같은 데이터 키를 다시 연다</text><text x="45" y="306" font-family="system-ui,Malgun Gothic,sans-serif" font-size="18" fill="#102e32" font-weight="400">세션 종료 → RAM 상태/키 핸들 정리</text><text x="45" y="338" font-family="system-ui,Malgun Gothic,sans-serif" font-size="18" fill="#102e32" font-weight="400">다음 세션 → 같은 TA UUID + Object ID로 기존 키 열기</text><text x="45" y="375" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#9a4b18" font-weight="400">실증: 재부팅 전후 공개키 동일. 키 객체와 세션 상태의 수명은 서로 다르다.</text></svg>