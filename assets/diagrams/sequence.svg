<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc"><title id="title">승인부터 데이터 서명까지</title><desc id="desc">CA가 TA와 같은 세션을 유지하며 요청을 노트북에서 승인받고, TA는 자기 상태로 요청을 재구성하여 검증한다.</desc><rect width="100%" height="100%" fill="#f6f4ef"/><rect x="25" y="18" width="270" height="85" rx="12" fill="#ffffff" stroke="#ccd9d2"/><text x="43" y="49" font-family="system-ui,Malgun Gothic,sans-serif" font-size="21" fill="#102e32" font-weight="700">노트북 승인 도구</text><text x="43" y="78" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#536a6d" font-weight="400">승인 개인키</text><rect x="385" y="18" width="270" height="85" rx="12" fill="#ffffff" stroke="#ccd9d2"/><text x="403" y="49" font-family="system-ui,Malgun Gothic,sans-serif" font-size="21" fill="#102e32" font-weight="700">Linux CA</text><text x="403" y="78" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#536a6d" font-weight="400">같은 세션 유지</text><rect x="745" y="18" width="270" height="85" rx="12" fill="#ffffff" stroke="#ccd9d2"/><text x="763" y="49" font-family="system-ui,Malgun Gothic,sans-serif" font-size="21" fill="#102e32" font-weight="700">OP-TEE TA</text><text x="763" y="78" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#536a6d" font-weight="400">데이터 개인키</text><line x1="160" y1="114" x2="160" y2="609" stroke="#ccd9d2" stroke-width="2" stroke-dasharray="7 5"/><polygon points="160,609 155.6503446588877,599.9955289764732 164.3496553411123,599.9955289764732" fill="#ccd9d2"/><line x1="520" y1="114" x2="520" y2="609" stroke="#ccd9d2" stroke-width="2" stroke-dasharray="7 5"/><polygon points="520,609 515.6503446588877,599.9955289764732 524.3496553411123,599.9955289764732" fill="#ccd9d2"/><line x1="880" y1="114" x2="880" y2="609" stroke="#ccd9d2" stroke-width="2" stroke-dasharray="7 5"/><polygon points="880,609 875.6503446588877,599.9955289764732 884.3496553411123,599.9955289764732" fill="#ccd9d2"/><rect x="525" y="121" width="350" height="29" rx="12" fill="#f6f4ef" stroke="#f6f4ef"/><text x="530" y="143" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#102e32" font-weight="400">1  PREPARE: 원문 SHA-256 전달</text><line x1="520" y1="155" x2="880" y2="155" stroke="#176650" stroke-width="2"/><polygon points="880,155 870.9955289764732,159.3496553411123 870.9955289764732,150.6503446588877" fill="#176650"/><rect x="525" y="186" width="350" height="29" rx="12" fill="#f6f4ef" stroke="#f6f4ef"/><text x="530" y="208" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#102e32" font-weight="400">2  새 챌린지 반환 · TA는 해시 보관</text><line x1="880" y1="220" x2="520" y2="220" stroke="#176650" stroke-width="2"/><polygon points="520,220 529.0044710235268,215.6503446588877 529.0044710235268,224.3496553411123" fill="#176650"/><rect x="165" y="251" width="350" height="29" rx="12" fill="#f6f4ef" stroke="#f6f4ef"/><text x="170" y="273" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#102e32" font-weight="400">3  CA가 요청 132B 직렬화 → 파일 전달</text><line x1="520" y1="285" x2="160" y2="285" stroke="#176650" stroke-width="2"/><polygon points="160,285 169.00447102352678,280.6503446588877 169.00447102352678,289.3496553411123" fill="#176650"/><rect x="165" y="316" width="350" height="29" rx="12" fill="#f6f4ef" stroke="#f6f4ef"/><text x="170" y="338" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#102e32" font-weight="400">4  APPROVE → 승인 서명 256B 반환</text><line x1="160" y1="350" x2="520" y2="350" stroke="#176650" stroke-width="2"/><polygon points="520,350 510.9955289764732,354.3496553411123 510.9955289764732,345.6503446588877" fill="#176650"/><rect x="525" y="381" width="350" height="29" rx="12" fill="#f6f4ef" stroke="#f6f4ef"/><text x="530" y="403" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#102e32" font-weight="400">5  SIGN_AUTHORIZED: 승인 서명 제출</text><line x1="520" y1="415" x2="880" y2="415" stroke="#176650" stroke-width="2"/><polygon points="880,415 870.9955289764732,419.3496553411123 870.9955289764732,410.6503446588877" fill="#176650"/><rect x="525" y="511" width="350" height="29" rx="12" fill="#f6f4ef" stroke="#f6f4ef"/><text x="530" y="533" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#102e32" font-weight="400">7  데이터 서명 반환 → CA에서 검증</text><line x1="880" y1="545" x2="520" y2="545" stroke="#176650" stroke-width="2"/><polygon points="520,545 529.0044710235268,540.6503446588877 529.0044710235268,549.3496553411123" fill="#176650"/><rect x="610" y="445" width="405" height="61" rx="12" fill="#102e32" stroke="#102e32"/><text x="625" y="470" font-family="system-ui,Malgun Gothic,sans-serif" font-size="18" fill="#ffffff" font-weight="700">6  TA 상태로 재구성 → 승인 검증</text><text x="625" y="495" font-family="system-ui,Malgun Gothic,sans-serif" font-size="16" fill="#ffffff" font-weight="400">요청 소비 · 유효한 경우만 데이터 서명</text><text x="45" y="624" font-family="system-ui,Malgun Gothic,sans-serif" font-size="16" fill="#536a6d" font-weight="400">실패: TA 오류 반환, CA 정상 서명 PASS 없음. 정상/변조/다른 키/새 요청 재사용은 실물 시험 완료.</text></svg>