<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="350" viewBox="0 0 1040 350" role="img" aria-labelledby="title desc"><title id="title">승인 서명이 묶는 132바이트</title><desc id="desc">도메인, TA UUID, 승인 동작, 대상 키 지문, 새 챌린지, 원문 해시 전체를 서명한다.</desc><rect width="100%" height="100%" fill="#f6f4ef"/><text x="24" y="38" font-family="system-ui,Malgun Gothic,sans-serif" font-size="25" fill="#102e32" font-weight="700">request.bin = 132 bytes</text><rect x="24" y="62" width="154" height="112" rx="12" fill="#e7f2ec" stroke="#ccd9d2"/><text x="36" y="93" font-family="system-ui,Malgun Gothic,sans-serif" font-size="18" fill="#102e32" font-weight="700">도메인</text><text x="36" y="125" font-family="system-ui,Malgun Gothic,sans-serif" font-size="23" fill="#102e32" font-weight="700">16 B</text><text x="36" y="153" font-family="system-ui,Malgun Gothic,sans-serif" font-size="15" fill="#102e32" font-weight="400">0..15</text><rect x="190" y="62" width="154" height="112" rx="12" fill="#e7f2ec" stroke="#ccd9d2"/><text x="202" y="93" font-family="system-ui,Malgun Gothic,sans-serif" font-size="18" fill="#102e32" font-weight="700">TA UUID</text><text x="202" y="125" font-family="system-ui,Malgun Gothic,sans-serif" font-size="23" fill="#102e32" font-weight="700">16 B</text><text x="202" y="153" font-family="system-ui,Malgun Gothic,sans-serif" font-size="15" fill="#102e32" font-weight="400">16..31</text><rect x="356" y="62" width="154" height="112" rx="12" fill="#e7f2ec" stroke="#ccd9d2"/><text x="368" y="93" font-family="system-ui,Malgun Gothic,sans-serif" font-size="18" fill="#102e32" font-weight="700">승인 동작</text><text x="368" y="125" font-family="system-ui,Malgun Gothic,sans-serif" font-size="23" fill="#102e32" font-weight="700">4 B</text><text x="368" y="153" font-family="system-ui,Malgun Gothic,sans-serif" font-size="15" fill="#102e32" font-weight="400">32..35</text><rect x="522" y="62" width="154" height="112" rx="12" fill="#102e32" stroke="#ccd9d2"/><text x="534" y="93" font-family="system-ui,Malgun Gothic,sans-serif" font-size="18" fill="#ffffff" font-weight="700">대상 키 지문</text><text x="534" y="125" font-family="system-ui,Malgun Gothic,sans-serif" font-size="23" fill="#ffffff" font-weight="700">32 B</text><text x="534" y="153" font-family="system-ui,Malgun Gothic,sans-serif" font-size="15" fill="#ffffff" font-weight="400">36..67</text><rect x="688" y="62" width="154" height="112" rx="12" fill="#102e32" stroke="#ccd9d2"/><text x="700" y="93" font-family="system-ui,Malgun Gothic,sans-serif" font-size="18" fill="#ffffff" font-weight="700">챌린지</text><text x="700" y="125" font-family="system-ui,Malgun Gothic,sans-serif" font-size="23" fill="#ffffff" font-weight="700">32 B</text><text x="700" y="153" font-family="system-ui,Malgun Gothic,sans-serif" font-size="15" fill="#ffffff" font-weight="400">68..99</text><rect x="854" y="62" width="154" height="112" rx="12" fill="#102e32" stroke="#ccd9d2"/><text x="866" y="93" font-family="system-ui,Malgun Gothic,sans-serif" font-size="18" fill="#ffffff" font-weight="700">원문 해시</text><text x="866" y="125" font-family="system-ui,Malgun Gothic,sans-serif" font-size="23" fill="#ffffff" font-weight="700">32 B</text><text x="866" y="153" font-family="system-ui,Malgun Gothic,sans-serif" font-size="15" fill="#ffffff" font-weight="400">100..131</text><line x1="520" y1="180" x2="520" y2="211" stroke="#176650" stroke-width="2"/><polygon points="520,211 515.6503446588877,201.99552897647322 524.3496553411123,201.99552897647322" fill="#176650"/><rect x="130" y="218" width="780" height="70" rx="12" fill="#ffffff" stroke="#ccd9d2"/><text x="153" y="247" font-family="system-ui,Malgun Gothic,sans-serif" font-size="18" fill="#176650" font-weight="700">전체 132B → SHA-256 → 승인키로 RSA 서명 → approval.sig (256B)</text><text x="153" y="274" font-family="system-ui,Malgun Gothic,sans-serif" font-size="16" fill="#102e32" font-weight="400">TA는 공유 파일을 신뢰하지 않고 자체 세션·실제 키로 같은 바이트열을 재구성한다.</text><text x="24" y="326" font-family="system-ui,Malgun Gothic,sans-serif" font-size="16" fill="#536a6d" font-weight="400">원문은 포함하지 않고 해시로 결합한다. 동작 8은 승인 대상 식별자이며 실제 제출 명령은 11이다.</text></svg>