<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc"><title id="title">PING과 GET_COUNT의 왕복 흐름</title><desc id="desc">같은 세션에서 CA가 PING으로 증가를 요청하고 GET_COUNT로 카운터를 읽는다. OP-TEE는 진입점을 호출하고 진입점이 state를 내부 함수에 넘긴다.</desc><rect width="100%" height="100%" fill="#f6f4ef"/><rect x="20" y="18" width="300" height="86" rx="12" fill="#ffffff" stroke="#ccd9d2"/><text x="38" y="49" font-family="system-ui,Malgun Gothic,sans-serif" font-size="21" fill="#102e32" font-weight="700">CA · run_ping</text><text x="38" y="78" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#536a6d" font-weight="400">operation / 같은 session</text><rect x="370" y="18" width="300" height="86" rx="12" fill="#ffffff" stroke="#ccd9d2"/><text x="388" y="49" font-family="system-ui,Malgun Gothic,sans-serif" font-size="21" fill="#102e32" font-weight="700">OP-TEE → TA 진입점</text><text x="388" y="78" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#536a6d" font-weight="400">TA_InvokeCommandEntryPoint</text><rect x="720" y="18" width="300" height="86" rx="12" fill="#ffffff" stroke="#ccd9d2"/><text x="738" y="49" font-family="system-ui,Malgun Gothic,sans-serif" font-size="21" fill="#102e32" font-weight="700">TA 내부 함수</text><text x="738" y="78" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#536a6d" font-weight="400">같은 session_state 사용</text><line x1="170" y1="112" x2="170" y2="461" stroke="#ccd9d2" stroke-width="2" stroke-dasharray="7 5"/><polygon points="170,461 165.6503446588877,451.9955289764732 174.3496553411123,451.9955289764732" fill="#ccd9d2"/><line x1="520" y1="112" x2="520" y2="461" stroke="#ccd9d2" stroke-width="2" stroke-dasharray="7 5"/><polygon points="520,461 515.6503446588877,451.9955289764732 524.3496553411123,451.9955289764732" fill="#ccd9d2"/><line x1="870" y1="112" x2="870" y2="461" stroke="#ccd9d2" stroke-width="2" stroke-dasharray="7 5"/><polygon points="870,461 865.6503446588877,451.9955289764732 874.3496553411123,451.9955289764732" fill="#ccd9d2"/><text x="182" y="137" font-family="system-ui,Malgun Gothic,sans-serif" font-size="16" fill="#102e32" font-weight="400">① InvokeCommand(PING)</text><line x1="170" y1="150" x2="520" y2="150" stroke="#176650" stroke-width="2"/><polygon points="520,150 510.9955289764732,154.3496553411123 510.9955289764732,145.6503446588877" fill="#176650"/><text x="532" y="195" font-family="system-ui,Malgun Gothic,sans-serif" font-size="16" fill="#102e32" font-weight="400">② handle_ping(state, types)</text><line x1="520" y1="208" x2="870" y2="208" stroke="#176650" stroke-width="2"/><polygon points="870,208 860.9955289764732,212.3496553411123 860.9955289764732,203.6503446588877" fill="#176650"/><text x="182" y="263" font-family="system-ui,Malgun Gothic,sans-serif" font-size="16" fill="#102e32" font-weight="400">③ ping_count 증가 후 SUCCESS 반환</text><line x1="870" y1="276" x2="170" y2="276" stroke="#176650" stroke-width="2"/><polygon points="170,276 179.00447102352678,271.6503446588877 179.00447102352678,280.3496553411123" fill="#176650"/><text x="182" y="325" font-family="system-ui,Malgun Gothic,sans-serif" font-size="16" fill="#102e32" font-weight="400">④ InvokeCommand(GET_COUNT)</text><line x1="170" y1="338" x2="520" y2="338" stroke="#176650" stroke-width="2"/><polygon points="520,338 510.9955289764732,342.3496553411123 510.9955289764732,333.6503446588877" fill="#176650"/><text x="532" y="383" font-family="system-ui,Malgun Gothic,sans-serif" font-size="16" fill="#102e32" font-weight="400">⑤ handle_ping_get_count(state, types, params)</text><line x1="520" y1="396" x2="870" y2="396" stroke="#176650" stroke-width="2"/><polygon points="870,396 860.9955289764732,400.3496553411123 860.9955289764732,391.6503446588877" fill="#176650"/><text x="182" y="446" font-family="system-ui,Malgun Gothic,sans-serif" font-size="16" fill="#102e32" font-weight="400">⑥ params[0].value.a에 count → CA operation으로 반환</text><line x1="870" y1="459" x2="170" y2="459" stroke="#176650" stroke-width="2"/><polygon points="170,459 179.00447102352678,454.6503446588877 179.00447102352678,463.3496553411123" fill="#176650"/><text x="30" y="502" font-family="system-ui,Malgun Gothic,sans-serif" font-size="17" fill="#536a6d" font-weight="400">CA는 반환된 operation.params[0].value.a를 읽고 예상 횟수와 비교한다. 다음 반복도 같은 세션이다.</text></svg>